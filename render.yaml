# Render Blueprint — hosts the read-only API as a free web service.
# In Render: New + -> Blueprint -> connect this repo. Render reads this file.
# You then set the DATABASE_URL secret in the dashboard (it is NOT in the repo).
#
# Instance plan: `starter` ($7/mo) rather than `free`, because a free instance
# sleeps after ~15 min idle and the first request back takes ~30-60s — which is
# what the app's "Waking up the server" message is really reporting. Paid
# instances never spin down.
#
# This service is Blueprint-managed, so this file is what Render syncs to. Do
# not change the plan only in the dashboard: the value here is authoritative and
# a later sync would put the dashboard change back to whatever is written below.
#
# (Note this is a separate bill from the Neon database, and a separate problem —
# the outage on 2026-07-31 was the database's compute allowance, not this
# instance. See docs/db-budget.md before assuming a slow app is Render's fault.)
services:
  - type: web
    name: moto-tracker-api
    runtime: python
    plan: starter           # always-on; `free` sleeps after ~15 min idle
    region: virginia            # closest to the Neon us-east-1 database
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false             # set this secret in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Live Activity APNs credentials — set values in the Render dashboard.
      - key: APNS_KEY_B64
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
