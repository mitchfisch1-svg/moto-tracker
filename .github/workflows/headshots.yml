name: headshots

# Rider photos come from Feld and are name-slugged, so a team change normally
# takes care of itself. What needs watching is Feld NOT re-shooting someone -
# they end up racing all season in last year's kit. This flags that on its own
# instead of anyone noticing by eye.
on:
  schedule:
    - cron: "20 6 * * 1"     # Mondays, after the weekend's results land
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sync Feld headshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_headshots.py
      # Picks up riders Feld has never shot - new privateers each week, and the
      # whole WMX field. Runs after Feld so it only ever fills real gaps.
      - name: Sync Racer X fallbacks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_racerx_headshots.py
      # Entry lists carry an explicit Bike column, which is the only source that
      # knows a privateer's make - their team name has no brand in it, and the
      # live feed only covers riders who are actually on track.
      - name: Sync bike makes from entry lists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_entry_bikes.py
      - name: Audit headshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/audit_headshots.py
