# Assert what must be true of PRODUCTION, hourly.
#
# The unit suite tests logic and has never caught a bug that reached a phone —
# every one of those was a data bug: missing, stale, mis-keyed or mis-rendered.
# This is the half that watches the data, so we hear about it before Mitch does.
name: audit

on:
  schedule:
    - cron: "40 * * * *"     # hourly, off the cron rush
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit.py"
      - "src/**"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-api.txt
      - name: Check production invariants
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          python scripts/audit.py | tee audit.txt
      # A red job on GitHub went unseen for 11 days in September, and the test
      # job for four weeks. So a failure goes to Mitch's phone (ntfy, topic in
      # the NTFY_TOPIC secret): when a check first fails, then every six hours
      # while it stays failed, so a problem nags without paging every hour.
      - name: Tell Mitch's phone
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_RUNS: ${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/audit.yml/runs?status=completed&per_page=1
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          prev=$(curl -s "$API_RUNS" | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs') or [{}]; print(r[0].get('conclusion') or '')")
          hour=$(date -u +%H)
          if [ "$prev" = "failure" ] && [ $((10#$hour % 6)) -ne 0 ]; then exit 0; fi
          msg=$(grep -A3 '^FAIL' audit.txt 2>/dev/null | head -c 1200)
          [ -n "$msg" ] || msg="The audit job itself failed to run."
          curl -s -H "Title: MXT data check failed" -H "Priority: high" -H "Tags: warning"             -H "Click: $RUN_URL" -d "$msg" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
